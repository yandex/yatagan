[versions]

# Kotlin version used to build Yatagan.
# Capped by 'testing-roomCompileTesting': its embedded Kotlin 2.3 compile-testing toolchain
# must be able to read the metadata this version produces (same minor + 1 at most).
kotlin = "2.4.10"
# Must be compatible with 'kotlin' (KSP2 is versioned independently of Kotlin)
ksp = "2.3.10"
# Must be compatible with 'kotlin'
dokka = "2.2.0"

dagger = "2.60.1"

# Yatagan version used to build Yatagan
yataganDogFood = "1.6.2"

[libraries]
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
dokka-gradle = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
publish-gradle = "com.vanniktech:gradle-maven-publish-plugin:0.37.0"

kotlin-binaryCompatibilityGradle.group = "org.jetbrains.kotlinx.binary-compatibility-validator"
kotlin-binaryCompatibilityGradle.name = "org.jetbrains.kotlinx.binary-compatibility-validator.gradle.plugin"
kotlin-binaryCompatibilityGradle.version = "0.18.1"

kotlin-koverGradle = "org.jetbrains.kotlinx:kover-gradle-plugin:0.9.8"

ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-gradle = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

kotlin-gradlePluginApi = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
shadow-gradle = "com.gradleup.shadow:shadow-gradle-plugin:9.5.1"

autoCommon = "com.google.auto:auto-common:1.2.2"
poets-java = "com.squareup:javapoet:1.13.0"
poets-kotlin = "com.squareup:kotlinpoet:2.3.0"

logicng = "org.logicng:logicng:2.6.2"

yataganDogFood-api = { module = "com.yandex.yatagan:api-compiled", version.ref = "yataganDogFood" }
yataganDogFood-ksp = { module = "com.yandex.yatagan:processor-ksp", version.ref = "yataganDogFood" }

# Testing libraries
testing-roomCompileTesting = "androidx.room3:room3-compiler-processing-testing:3.0.0"
testing-junit4 = "junit:junit:4.13.2"
testing-assertj = "org.assertj:assertj-core:3.27.7"
testing-dagger-api =  { module = "com.google.dagger:dagger", version.ref = "dagger" }
testing-dagger-processor =  { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
